[package]
name = "adaptive-admission-core"
version.workspace = true
description = "Portable deterministic admission-control state machine"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage = "https://github.com/jfrz38/adaptive-admission-controller"
documentation = "https://docs.rs/adaptive-admission-core"
keywords = ["admission-control", "concurrency", "load-shedding", "pid-controller"]
