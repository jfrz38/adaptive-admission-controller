name: CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run required checks
        run: make check

  component:
    name: WebAssembly component
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore wasm-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install wasm-tools
        run: make install-wasm-tools
      - name: Build and validate component
        run: make component

  release-preflight:
    name: Release preflight
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify release version increased
        uses: jfrz38/check-version-change@176c454a13e14862ec362573f26c9e9395855d0c # v1.5.0
        with:
          file-path: Cargo.toml
          file-format: raw
          version-pattern: '^version\s*=\s*"(\d+\.\d+\.\d+)"'
          compare-source: git-ref
          allow-missing-compare-file: true
          fail-on-unchanged: true
          fail-on-not-higher: true
      - name: Verify release version is unused
        shell: bash
        run: |
          version=$(sh scripts/release-version.sh)
          tag="v${version}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; bump the workspace and WIT versions." >&2
            exit 1
          fi
          if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"; then
            echo "Tag ${tag} already exists; bump the workspace and WIT versions." >&2
            exit 1
          fi
