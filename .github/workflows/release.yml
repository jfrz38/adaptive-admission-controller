name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run required checks
        run: make check
      - name: Verify release version increased
        uses: jfrz38/check-version-change@176c454a13e14862ec362573f26c9e9395855d0c # v1.5.0
        with:
          file-path: Cargo.toml
          file-format: raw
          version-pattern: '^version\s*=\s*"(\d+\.\d+\.\d+)"'
          compare-source: git-ref
          compare-ref: ${{ github.event.before }}
          allow-missing-compare-file: true
          fail-on-unchanged: true
          fail-on-not-higher: true

  build:
    name: Build release assets
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore wasm-tools
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
      - name: Install wasm-tools
        run: make install-wasm-tools
      - name: Build distribution
        run: make dist
      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download validated assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Publish release
        shell: bash
        run: |
          version=$(cat dist/VERSION)
          tag="v${version}"

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            is_draft=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft')
            target=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json targetCommitish --jq '.targetCommitish')
            if [ "${is_draft}" != "true" ] || [ "${target}" != "${GITHUB_SHA}" ]; then
              echo "Release ${tag} already exists and is not a resumable draft for ${GITHUB_SHA}." >&2
              exit 1
            fi
          else
            if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}"; then
              echo "Tag ${tag} already exists without a release; refusing to reuse it." >&2
              exit 1
            fi
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Adaptive Admission Controller ${tag}" \
              --generate-notes \
              --draft
          fi

          gh release upload "${tag}" \
            dist/adaptive-admission-component-v${version}.wasm \
            dist/adaptive-admission-world-v${version}.wit \
            dist/adaptive-admission-conformance-v${version}.tar.gz \
            dist/adaptive-admission-release-v${version}.json \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          expected_assets=$(printf '%s\n' \
            "adaptive-admission-component-v${version}.wasm" \
            "adaptive-admission-world-v${version}.wit" \
            "adaptive-admission-conformance-v${version}.tar.gz" \
            "adaptive-admission-release-v${version}.json" \
            "SHA256SUMS" | sort)
          actual_assets=$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)
          if [ "${actual_assets}" != "${expected_assets}" ]; then
            echo "Draft release assets do not match the expected distribution." >&2
            exit 1
          fi

          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
